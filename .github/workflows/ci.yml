# Pull request validation: builds Release. Publishes nothing.
name: CI

on:
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.x
            11.x

      - name: Restore
        run: dotnet restore MahApps.Extra.sln

      - name: Build
        run: dotnet build MahApps.Extra.sln --configuration Release --no-restore

